[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptosurge"
version = "2.0.0"
description = "7-day crypto surge prediction trained on the full Binance daily history of 100 coins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn==1.9.1",
  "joblib>=1.3",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["matplotlib>=3.8", "pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
cryptosurge-download = "cryptosurge.download:main"
cryptosurge-train = "cryptosurge.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cryptosurge = ["artifacts/*", "dashboard/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
